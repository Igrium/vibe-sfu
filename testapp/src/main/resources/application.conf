# Overrides for libraries the SFU uses. Mirrors jitsi-videobridge's own application.conf.
ice4j {
  harvest {
    udp {
      # Size (bytes) for the UDP socket SO_RCVBUF. ice4j's default leaves this unset, so the OS
      # default (~104KB here) is used — far too small for video: a keyframe burst overflows the
      # socket buffer and the OS drops incoming packets, which shows up as ~40% incoming packet
      # loss and video that never decodes. jitsi-videobridge sets 10MB for exactly this reason.
      receive-buffer-size = 10485760
    }
  }
}
