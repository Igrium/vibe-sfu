<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>jitsi-sfu demo client</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  #log { border: 1px solid #ccc; padding: 0.5rem; min-height: 8rem; white-space: pre-line; }
  .ok { color: #070; }
  .err { color: #a00; }
  video { width: 240px; height: 180px; background: #222; margin-right: 1rem; }
</style>
</head>
<body>
<h1>jitsi-sfu demo client</h1>
<p>Peer name: <b id="name"></b> &mdash; ICE: <b id="ice">new</b> &mdash; data channel: <b id="dc">closed</b></p>
<div>
  <video id="localVideo" autoplay playsinline muted></video>
  <video id="remoteVideo" autoplay playsinline muted></video>
</div>
<div id="log"></div>
<script>
"use strict";

// State inspected by the Playwright end-to-end test.
window.testState = {
    name: new URLSearchParams(location.search).get("name") || ("peer" + Math.floor(Math.random() * 1000)),
    ice: "new",
    dcOpen: false,
    messages: [],
    errors: [],
    // Kinds of remote tracks seen via pc.ontrack (e.g. ["audio", "video"]).
    remoteTracks: []
};

const logDiv = document.getElementById("log");
function log(cls, text) {
    const line = document.createElement("div");
    line.className = cls;
    line.textContent = text;
    logDiv.appendChild(line);
}

document.getElementById("name").textContent = testState.name;

const pc = new RTCPeerConnection();
// Exposed for the Playwright test harness (page.evaluate reads window.pc.getStats()).
window.pc = pc;
const dc = pc.createDataChannel("chat");

pc.oniceconnectionstatechange = () => {
    testState.ice = pc.iceConnectionState;
    document.getElementById("ice").textContent = pc.iceConnectionState;
    log("", "ICE state: " + pc.iceConnectionState);
};

pc.ontrack = (event) => {
    log("ok", "ontrack: " + event.track.kind);
    testState.remoteTracks.push(event.track.kind);
    let stream = event.streams[0];
    if (!stream) {
        // No a=msid in the answer (this demo's SdpUtils doesn't emit one) - synthesize one so
        // the <video> element still has something to render.
        stream = new MediaStream([event.track]);
    }
    if (event.track.kind === "video") {
        document.getElementById("remoteVideo").srcObject = stream;
    }
};

dc.onopen = () => {
    testState.dcOpen = true;
    document.getElementById("dc").textContent = "open";
    log("ok", "data channel open");
};
dc.onclose = () => {
    testState.dcOpen = false;
    document.getElementById("dc").textContent = "closed";
};
dc.onmessage = (e) => {
    testState.messages.push(e.data);
    log("ok", "received: " + e.data);
};
dc.onerror = (e) => {
    testState.errors.push(String(e.error || e));
    log("err", "data channel error: " + (e.error || e));
};

// Used by the test to send a message through the SFU.
window.sendMessage = (text) => dc.send(text);

function waitForGathering(pc) {
    if (pc.iceGatheringState === "complete") return Promise.resolve();
    return new Promise((resolve) => {
        pc.addEventListener("icegatheringstatechange", () => {
            if (pc.iceGatheringState === "complete") resolve();
        });
        // Don't wait forever; host candidates are enough for a local test.
        setTimeout(resolve, 2000);
    });
}

(async () => {
    try {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            document.getElementById("localVideo").srcObject = stream;
            for (const track of stream.getTracks()) {
                pc.addTrack(track, stream);
            }
            log("ok", "getUserMedia: " + stream.getTracks().map(t => t.kind).join(", "));
        } catch (mediaErr) {
            // Media is best-effort for browsers without fake devices; the data channel path
            // still works without it.
            log("err", "getUserMedia failed: " + mediaErr);
        }

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await waitForGathering(pc);
        const resp = await fetch("/offer", { method: "POST", body: pc.localDescription.sdp });
        if (!resp.ok) throw new Error("offer failed: HTTP " + resp.status + " " + await resp.text());
        const answerSdp = await resp.text();
        await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
        log("", "answer applied, connecting…");
    } catch (e) {
        testState.errors.push(String(e));
        log("err", String(e));
    }
})();
</script>
</body>
</html>
